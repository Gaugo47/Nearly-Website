name: Verify and publish GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publier le site sur GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_WAITLIST_API_URL: ${{ vars.WAITLIST_API_URL }}
      NEXT_PUBLIC_PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      NEXT_PUBLIC_PUBLISHER_STATUS: ${{ vars.PUBLISHER_STATUS }}
      NEXT_PUBLIC_PUBLISHER_ADDRESS: ${{ vars.PUBLISHER_ADDRESS }}
      NEXT_PUBLIC_PUBLICATION_DIRECTOR: ${{ vars.PUBLICATION_DIRECTOR }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      NEXT_PUBLIC_WAITLIST_HOST: ${{ vars.WAITLIST_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/pages-env.mjs
      - run: node scripts/check-publish.mjs
        if: github.event_name == 'workflow_dispatch' && inputs.publish
      - run: npm ci
      - run: npm run check:public
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
